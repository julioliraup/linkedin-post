name: 'LinkedIn Post'
description: 'Publish a text or image post to LinkedIn via the Posts API.'
author: 'Julio Lira'

branding:
  icon: 'share-2'
  color: 'blue'

inputs:
  linkedin_access_token:
    description: 'OAuth 2.0 Access Token from the LinkedIn Developer Portal.'
    required: true

  linkedin_person_urn:
    description: 'Author URN (e.g. urn:li:person:XXXXXXXXX). Obtained via GET /v2/userinfo.'
    required: true

  post_text:
    description: 'Text body of the post.'
    required: false
    default: 'Posted automatically via GitHub Actions!'

  image_path:
    description: 'Path to a local image file (JPG, PNG or GIF). Leave empty for a text-only post.'
    required: false
    default: ''

  python_version:
    description: 'Python version to use on the runner.'
    required: false
    default: '3.11'

outputs:
  post_id:
    description: 'The LinkedIn URN of the published post (x-restli-id response header).'
    value: ${{ steps.post.outputs.post_id }}

  status:
    description: '"success" or "failure".'
    value: ${{ steps.post.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      run: python -m pip install --quiet --upgrade pip requests

    - name: Publish post
      id: post
      shell: bash
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ inputs.linkedin_access_token }}
        LINKEDIN_PERSON_URN: ${{ inputs.linkedin_person_urn }}
        POST_TEXT: ${{ inputs.post_text }}
        IMAGE_PATH: ${{ inputs.image_path }}
      run: |
        set +e
        python "${{ github.action_path }}/share_linkedin.py"
        EXIT_CODE=$?
        if [ $EXIT_CODE -eq 0 ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "status=failure" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        fi
